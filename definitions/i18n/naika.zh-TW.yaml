# 「内科 初診問診票」の 繁體中文 の画面（患者さんに見せる言葉の訳）。
# Claude が訳し、人が確かめて公開したもの。label はもとの日本語（変えない）。訳は text と detail。
# 問診票の言葉を変えたら、この訳は使われなくなる（作る画面の「外国語」で作り直す）。
id: "naika"
lang: "zh-TW"
key: "e70950652e6f"
title: "內科 初診問診單"
questions:
  - id: "age"
    text: "請告訴我們您的年齡。"
    unit: "歲"
  - id: "sex"
    text: "請告訴我們您的性別。"
    options:
      - label: "男性"
        text: "男性"
      - label: "女性"
        text: "女性"
  - id: "myna_consent"
    text: "使用日本的個人編號健保卡（マイナ保険証）時，您是否已同意讓醫院查看您的就醫資料？"
    options:
      - label: "はい"
        text: "是"
      - label: "いいえ"
        text: "否"
  - id: "temp_now"
    text: "請告訴我們您現在的體溫。"
    hint: "如果沒有量，請跳過。"
    unit: "℃"
  - id: "temp_max"
    text: "這次出現症狀以來，您最高的體溫是多少？"
    hint: "如果沒有量，請跳過。"
    unit: "℃"
  - id: "temp_max_date"
    text: "體溫最高是在什麼時候？"
    options:
      - label: "今日"
        text: "今天"
      - label: "昨日"
        text: "昨天"
      - label: "おととい"
        text: "前天"
      - label: "3日以上前"
        text: "3天以上前"
      - label: "わからない"
        text: "不知道"
  - id: "symptoms"
    text: "您有哪些症狀？想諮詢的事項也一樣，請選出所有符合的項目。"
    options:
      - label: "熱がある"
        text: "發燒"
      - label: "せき・たん"
        text: "咳嗽・有痰"
      - label: "のどが痛い"
        text: "喉嚨痛"
      - label: "頭が痛い"
        text: "頭痛"
      - label: "おなかが痛い"
        text: "肚子痛"
      - label: "胸が痛い・どうきがする"
        text: "胸痛・心悸"
      - label: "息苦しい"
        text: "呼吸困難"
      - label: "睡眠時無呼吸の相談"
        text: "諮詢睡眠呼吸中止"
      - label: "禁煙の相談"
        text: "諮詢戒菸"
      - label: "健康診断の精密検査の相談"
        text: "諮詢健康檢查後的進一步檢查"
      - label: "飲み込みの相談"
        text: "諮詢吞嚥問題"
      - label: "骨粗しょう症の相談"
        text: "諮詢骨質疏鬆"
      - label: "物忘れの相談"
        text: "諮詢健忘"
      - label: "その他"
        text: "其他"
        detail: "如果有其他症狀，請告訴我們"
  - id: "last_meal"
    text: "您最後一次吃東西，大約是幾點幾分？"
  - id: "onset"
    text: "這個症狀大約是從什麼時候開始的？"
    options:
      - label: "今日から"
        text: "從今天開始"
      - label: "昨日から"
        text: "從昨天開始"
      - label: "2〜3日前から"
        text: "從2～3天前開始"
      - label: "1週間くらい前から"
        text: "從大約1週前開始"
      - label: "2〜3週間前から"
        text: "從2～3週前開始"
      - label: "1か月くらい前から"
        text: "從大約1個月前開始"
      - label: "2〜3か月前から"
        text: "從2～3個月前開始"
      - label: "半年くらい前から"
        text: "從大約半年前開始"
      - label: "1年以上前から"
        text: "從1年多以前開始"
      - label: "わからない"
        text: "不知道"
  - id: "onset_time"
    text: "這個症狀大約是從幾點左右開始的？"
    options:
      - label: "朝"
        text: "早上"
      - label: "昼"
        text: "中午"
      - label: "夕方"
        text: "傍晚"
      - label: "夜"
        text: "晚上"
      - label: "夜中"
        text: "半夜"
      - label: "わからない"
        text: "不知道"
  - id: "allergy_food"
    text: "您有食物過敏嗎？"
    options:
      - label: "ある"
        text: "有"
      - label: "ない"
        text: "沒有"
      - label: "わからない"
        text: "不知道"
  - id: "allergy_food_items"
    text: "請選出所有會讓您過敏的食物。"
    options:
      - label: "卵"
        text: "蛋"
      - label: "牛乳"
        text: "牛奶"
      - label: "その他"
        text: "其他"
        detail: "請告訴我們食物的名稱"
  - id: "allergy_drug"
    text: "您是否有藥物過敏，或曾經因為吃藥而身體不舒服？"
    options:
      - label: "ある"
        text: "有"
        detail: "請告訴我們藥物的名稱"
      - label: "ない"
        text: "沒有"
      - label: "わからない"
        text: "不知道"
  - id: "history"
    text: "您以前是否動過手術或接受過治療，或是現在有在其他醫院看診？"
    options:
      - label: "はい"
        text: "是"
        detail: "請告訴我們疾病名稱和大約的時間（例：高血壓 10年前開始看診、胃部手術 2015年）"
      - label: "いいえ"
        text: "否"
  - id: "medication"
    text: "您現在有在吃藥嗎？"
    options:
      - label: "ある"
        text: "有"
        detail: "請告訴我們藥物的名稱"
      - label: "ない"
        text: "沒有"
      - label: "わからない"
        text: "不知道"
  - id: "smoking"
    text: "您抽菸嗎？"
    options:
      - label: "今、吸っている"
        text: "現在有抽"
      - label: "以前は吸っていた"
        text: "以前有抽"
      - label: "吸わない"
        text: "不抽"
  - id: "smoking_per_day"
    text: "您一天大約抽（或以前抽）幾支菸？"
    unit: "支"
  - id: "smoking_years"
    text: "您抽菸（或以前抽菸）的時間總共大約幾年？"
    unit: "年"
  - id: "alcohol"
    text: "您大約多常喝酒？"
    options:
      - label: "毎日"
        text: "每天"
      - label: "週に何日か飲む"
        text: "每週有幾天會喝"
      - label: "飲まない"
        text: "不喝"
  - id: "alcohol_days"
    text: "您一週喝幾天酒？"
    unit: "天"
  - id: "alcohol_amount"
    text: "請選出您每次喝的所有酒類。"
    options:
      - label: "ビール"
        text: "啤酒"
        detail: "每次的量（例：中瓶1瓶、350mL罐裝2罐）"
      - label: "日本酒"
        text: "日本清酒"
        detail: "每次的量（例：1合，約180mL）"
      - label: "焼酎"
        text: "燒酎"
        detail: "每次的量（例：1玻璃杯）"
      - label: "ワイン"
        text: "葡萄酒"
        detail: "每次的量（例：2杯）"
      - label: "ウイスキー"
        text: "威士忌"
        detail: "每次的量（例：雙份1杯）"
      - label: "チューハイ・サワー"
        text: "燒酎調酒・沙瓦"
        detail: "每次的量（例：350mL罐裝1罐）"
      - label: "その他"
        text: "其他"
        detail: "酒的種類和每次的量"
  - id: "pregnancy"
    text: "您現在是否懷孕中或哺乳中？"
    options:
      - label: "妊娠中"
        text: "懷孕中"
      - label: "授乳中"
        text: "哺乳中"
      - label: "妊娠していない"
        text: "沒有懷孕"
      - label: "わからない"
        text: "不知道"
  - id: "pregnancy_weeks"
    text: "您懷孕幾週了？"
    unit: "週"
  - id: "doctor_request"
    text: "您有希望由哪位醫師看診嗎？"
    options:
      - label: "希望はない"
        text: "沒有特別希望"
      - label: "希望する医師がいる"
        text: "有希望的醫師"
        detail: "請告訴我們醫師的姓名"
