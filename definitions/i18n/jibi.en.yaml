# 「耳鼻咽喉科 初診問診票」の English の画面（患者さんに見せる言葉の訳）。
# Claude が訳し、人が確かめて公開したもの。label はもとの日本語（変えない）。訳は text と detail。
# 問診票の言葉を変えたら、この訳は使われなくなる（作る画面の「外国語」で作り直す）。
id: "jibi"
lang: "en"
key: "742f4faf1052"
title: "Ear, Nose, and Throat (ENT) First Visit Questionnaire"
questions:
  - id: "age"
    text: "How old are you?"
    unit: "years old"
  - id: "sex"
    text: "What is your sex?"
    options:
      - label: "男性"
        text: "Male"
      - label: "女性"
        text: "Female"
  - id: "myna_consent"
    text: "Did you agree to let the hospital see your medical information through your My Number health insurance card (My Number Card)?"
    options:
      - label: "はい"
        text: "Yes"
      - label: "いいえ"
        text: "No"
  - id: "temp_now"
    text: "What is your temperature now?"
    hint: "If you did not take your temperature, please go to the next question."
    unit: "℃"
  - id: "temp_max"
    text: "Since these symptoms started, what was your highest temperature?"
    hint: "If you did not take your temperature, please go to the next question."
    unit: "℃"
  - id: "temp_max_date"
    text: "When was your temperature the highest?"
    options:
      - label: "今日"
        text: "Today"
      - label: "昨日"
        text: "Yesterday"
      - label: "おととい"
        text: "2 days ago"
      - label: "3日以上前"
        text: "3 or more days ago"
      - label: "わからない"
        text: "I don't know"
  - id: "symptoms"
    text: "What symptoms do you have? Please choose all that apply."
    options:
      - label: "めまい"
        text: "Dizziness"
      - label: "聞こえが悪い"
        text: "Trouble hearing"
      - label: "耳鳴り"
        text: "Ringing in the ear"
      - label: "耳が痛い"
        text: "Ear pain"
      - label: "耳汁（みみだれ）が出る"
        text: "Fluid coming out of the ear"
      - label: "耳がつまる"
        text: "Ear feels blocked"
      - label: "鼻がつまる"
        text: "Stuffy nose"
      - label: "くしゃみ"
        text: "Sneezing"
      - label: "鼻水"
        text: "Runny nose"
      - label: "鼻血"
        text: "Nosebleed"
      - label: "黄色や緑色のどろっとした鼻水"
        text: "Thick yellow or green mucus from the nose"
      - label: "のどが痛い"
        text: "Sore throat"
      - label: "のどがつまった感じ"
        text: "Throat feels blocked"
      - label: "声がかすれる"
        text: "Hoarse voice"
      - label: "咳が出る"
        text: "Cough"
      - label: "その他"
        text: "Other"
        detail: "Please tell us what symptoms you have"
  - id: "side_hearing"
    text: "Which ear has trouble hearing?"
    options:
      - label: "右"
        text: "Right"
      - label: "左"
        text: "Left"
      - label: "両方"
        text: "Both"
  - id: "side_tinnitus"
    text: "Which ear has ringing?"
    options:
      - label: "右"
        text: "Right"
      - label: "左"
        text: "Left"
      - label: "両方"
        text: "Both"
  - id: "side_ear_pain"
    text: "Which ear hurts?"
    options:
      - label: "右"
        text: "Right"
      - label: "左"
        text: "Left"
      - label: "両方"
        text: "Both"
  - id: "side_otorrhea"
    text: "Which ear has fluid coming out?"
    options:
      - label: "右"
        text: "Right"
      - label: "左"
        text: "Left"
      - label: "両方"
        text: "Both"
  - id: "side_ear_fullness"
    text: "Which ear feels blocked?"
    options:
      - label: "右"
        text: "Right"
      - label: "左"
        text: "Left"
      - label: "両方"
        text: "Both"
  - id: "onset"
    text: "When did these symptoms start?"
    options:
      - label: "今日から"
        text: "Today"
      - label: "昨日から"
        text: "Yesterday"
      - label: "2〜3日前から"
        text: "2–3 days ago"
      - label: "1週間くらい前から"
        text: "About 1 week ago"
      - label: "2〜3週間前から"
        text: "2–3 weeks ago"
      - label: "1か月くらい前から"
        text: "About 1 month ago"
      - label: "2〜3か月前から"
        text: "2–3 months ago"
      - label: "半年くらい前から"
        text: "About 6 months ago"
      - label: "1年以上前から"
        text: "1 year ago or more"
      - label: "わからない"
        text: "I don't know"
  - id: "onset_time"
    text: "About what time of day did these symptoms start?"
    options:
      - label: "朝"
        text: "Morning"
      - label: "昼"
        text: "Around noon"
      - label: "夕方"
        text: "Early evening"
      - label: "夜"
        text: "Night"
      - label: "夜中"
        text: "Middle of the night"
      - label: "わからない"
        text: "I don't know"
  - id: "allergy_food"
    text: "Do you have any food allergies?"
    options:
      - label: "ある"
        text: "Yes"
      - label: "ない"
        text: "No"
      - label: "わからない"
        text: "I don't know"
  - id: "allergy_food_items"
    text: "Please choose all foods you are allergic to."
    options:
      - label: "卵"
        text: "Eggs"
      - label: "牛乳"
        text: "Milk"
      - label: "小麦"
        text: "Wheat"
      - label: "そば"
        text: "Buckwheat (soba)"
      - label: "落花生（ピーナッツ）"
        text: "Peanuts"
      - label: "えび・かに"
        text: "Shrimp / crab"
      - label: "魚"
        text: "Fish"
      - label: "果物"
        text: "Fruit"
      - label: "大豆"
        text: "Soybeans"
      - label: "その他"
        text: "Other"
        detail: "Please tell us the name of the food"
  - id: "allergy_drug"
    text: "Do you have any medicine allergies, or have you ever had a bad reaction to a medicine?"
    options:
      - label: "ある"
        text: "Yes"
        detail: "Please tell us the name of the medicine"
      - label: "ない"
        text: "No"
      - label: "わからない"
        text: "I don't know"
  - id: "current_visit"
    text: "Are you now going to another hospital or clinic for treatment?"
    options:
      - label: "通院している"
        text: "Yes, I am"
        detail: "Please tell us the name of the illness"
      - label: "通院していない"
        text: "No, I am not"
  - id: "current_meds"
    text: "Are you taking any medicine now?"
    hint: "If you have a medicine record book (okusuri techo), please show it to the doctor during your exam."
    options:
      - label: "のんでいる"
        text: "Yes, I am"
        detail: "Please tell us the name of the medicine"
      - label: "のんでいない"
        text: "No, I am not"
  - id: "pregnancy"
    text: "Are you pregnant or breastfeeding now?"
    options:
      - label: "妊娠中"
        text: "Pregnant"
      - label: "授乳中"
        text: "Breastfeeding"
      - label: "妊娠していない"
        text: "Not pregnant"
      - label: "わからない"
        text: "I don't know"
  - id: "pregnancy_weeks"
    text: "How many weeks pregnant are you?"
    hint: "If you don't know, please go to the next question."
    unit: "weeks"
