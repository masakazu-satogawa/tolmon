# 「生活習慣病管理料 対象患者様 アンケート」の English の画面（患者さんに見せる言葉の訳）。
# Claude が訳し、人が確かめて公開したもの。label はもとの日本語（変えない）。訳は text と detail。
# 問診票の言葉を変えたら、この訳は使われなくなる（作る画面の「外国語」で作り直す）。
id: "seikatsu"
lang: "en"
key: "bf04cc352ab0"
title: "Lifestyle Disease Care Plan: Patient Questionnaire"
questions:
  - id: "meal_balance"
    text: "Do you eat 3 balanced meals a day?"
    options:
      - label: "はい"
        text: "Yes"
      - label: "いいえ"
        text: "No"
  - id: "vegetable_freq"
    text: "About how many times a week do you eat vegetables, mushrooms, or seaweed?"
    options:
      - label: "週に5〜7回"
        text: "5–7 times a week"
      - label: "週に3〜5回"
        text: "3–5 times a week"
      - label: "週に0〜2回"
        text: "0–2 times a week"
  - id: "fried_food_freq"
    text: "About how many times a week do you eat fried food?"
    options:
      - label: "週に0〜2回"
        text: "0–2 times a week"
      - label: "週に3〜5回"
        text: "3–5 times a week"
      - label: "週に5〜7回"
        text: "5–7 times a week"
  - id: "alcohol_freq"
    text: "About how many times a week do you drink alcohol?"
    options:
      - label: "週に0〜3回"
        text: "0–3 times a week"
      - label: "週に4〜6回"
        text: "4–6 times a week"
      - label: "週に7回"
        text: "7 times a week"
  - id: "snack_freq"
    text: "How many times a day do you eat snacks between meals?"
    options:
      - label: "0回"
        text: "0 times"
      - label: "1回"
        text: "1 time"
      - label: "2回以上"
        text: "2 or more times"
  - id: "meal_count"
    text: "How many meals do you eat a day?"
    options:
      - label: "3回"
        text: "3 times"
      - label: "1〜2回"
        text: "1–2 times"
      - label: "4回以上"
        text: "4 or more times"
  - id: "salty_food"
    text: "How much strongly flavored food do you eat? Which is closer?"
    options:
      - label: "少ない"
        text: "A little"
      - label: "多い"
        text: "A lot"
  - id: "eating_out_freq"
    text: "About how many times a week do you eat out?"
    options:
      - label: "週に0回"
        text: "0 times a week"
      - label: "週に1〜2回"
        text: "1–2 times a week"
      - label: "週に3回以上"
        text: "3 or more times a week"
  - id: "bento_freq"
    text: "About how many times a week do you eat store-bought boxed meals or ready-made dishes?"
    options:
      - label: "週に0〜1回"
        text: "0–1 times a week"
      - label: "週に2〜4回"
        text: "2–4 times a week"
      - label: "週に5回以上"
        text: "5 or more times a week"
  - id: "bread_freq"
    text: "About how many times a week do you eat bread?"
    options:
      - label: "週に0〜1回"
        text: "0–1 times a week"
      - label: "週に2〜4回"
        text: "2–4 times a week"
      - label: "週に5回以上"
        text: "5 or more times a week"
  - id: "noodle_freq"
    text: "About how many times a week do you eat noodles?"
    options:
      - label: "週に0〜1回"
        text: "0–1 times a week"
      - label: "週に2〜4回"
        text: "2–4 times a week"
      - label: "週に5回以上"
        text: "5 or more times a week"
  - id: "exercise_habit"
    text: "Have you been exercising enough to sweat lightly, for 30 minutes or more each time, 2 or more days a week, for 1 year or longer?"
    options:
      - label: "はい"
        text: "Yes"
      - label: "いいえ"
        text: "No"
  - id: "daily_activity"
    text: "In your daily life, do you walk or move your body in a similar way for 1 hour or more a day?"
    options:
      - label: "はい"
        text: "Yes"
      - label: "いいえ"
        text: "No"
  - id: "daytime_sleepiness"
    text: "Do you often feel sleepy during the day?"
    options:
      - label: "いいえ"
        text: "No"
      - label: "はい"
        text: "Yes"
  - id: "daytime_headache"
    text: "Do you often get headaches during the day?"
    options:
      - label: "いいえ"
        text: "No"
      - label: "はい"
        text: "Yes"
  - id: "eye_exam"
    text: "In the past year, have you seen an eye doctor?"
    options:
      - label: "はい"
        text: "Yes"
      - label: "いいえ"
        text: "No"
  - id: "dental_visit"
    text: "In the past year, have you seen a dentist?"
    options:
      - label: "はい"
        text: "Yes"
      - label: "いいえ"
        text: "No"
  - id: "smoking"
    text: "Do you smoke regularly now?"
    hint: "Guide: Answer \"Yes\" if you have smoked 100 or more cigarettes in total, or for 6 months or longer, and you have also smoked in the past month."
    options:
      - label: "いいえ"
        text: "No"
      - label: "はい"
        text: "Yes"
  - id: "smoking_cessation_clinic"
    text: "Would you like to visit a quit-smoking clinic (a clinic that helps you stop smoking)?"
    options:
      - label: "いいえ"
        text: "No"
      - label: "はい"
        text: "Yes"
