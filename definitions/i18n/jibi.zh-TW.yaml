# 「耳鼻咽喉科 初診問診票」の 繁體中文 の画面（患者さんに見せる言葉の訳）。
# Claude が訳し、人が確かめて公開したもの。label はもとの日本語（変えない）。訳は text と detail。
# 問診票の言葉を変えたら、この訳は使われなくなる（作る画面の「外国語」で作り直す）。
id: "jibi"
lang: "zh-TW"
key: "742f4faf1052"
title: "耳鼻喉科 初診問診表"
questions:
  - id: "age"
    text: "請告訴我們您的年齡。"
    unit: "歲"
  - id: "sex"
    text: "請告訴我們您的性別。"
    options:
      - label: "男性"
        text: "男性"
      - label: "女性"
        text: "女性"
  - id: "myna_consent"
    text: "您是否已透過日本的 My Number 健保卡（マイナ保険証），同意醫院查看您的就醫資訊？"
    options:
      - label: "はい"
        text: "是"
      - label: "いいえ"
        text: "否"
  - id: "temp_now"
    text: "請告訴我們您現在的體溫。"
    hint: "如果沒有量，請直接進入下一題。"
    unit: "℃"
  - id: "temp_max"
    text: "請告訴我們這次症狀出現後，最高的體溫是多少。"
    hint: "如果沒有量，請直接進入下一題。"
    unit: "℃"
  - id: "temp_max_date"
    text: "體溫最高是在什麼時候？"
    options:
      - label: "今日"
        text: "今天"
      - label: "昨日"
        text: "昨天"
      - label: "おととい"
        text: "前天"
      - label: "3日以上前"
        text: "3天前或更早"
      - label: "わからない"
        text: "不知道"
  - id: "symptoms"
    text: "您有哪些症狀？請選出所有符合的項目。"
    options:
      - label: "めまい"
        text: "頭暈"
      - label: "聞こえが悪い"
        text: "聽不清楚"
      - label: "耳鳴り"
        text: "耳鳴"
      - label: "耳が痛い"
        text: "耳朵痛"
      - label: "耳汁（みみだれ）が出る"
        text: "耳朵流出分泌物"
      - label: "耳がつまる"
        text: "耳朵悶塞"
      - label: "鼻がつまる"
        text: "鼻塞"
      - label: "くしゃみ"
        text: "打噴嚏"
      - label: "鼻水"
        text: "流鼻水"
      - label: "鼻血"
        text: "流鼻血"
      - label: "黄色や緑色のどろっとした鼻水"
        text: "黃色或綠色的濃稠鼻涕"
      - label: "のどが痛い"
        text: "喉嚨痛"
      - label: "のどがつまった感じ"
        text: "喉嚨有卡住的感覺"
      - label: "声がかすれる"
        text: "聲音沙啞"
      - label: "咳が出る"
        text: "咳嗽"
      - label: "その他"
        text: "其他"
        detail: "請告訴我們是什麼症狀"
  - id: "side_hearing"
    text: "是哪一邊的耳朵聽不清楚？"
    options:
      - label: "右"
        text: "右邊"
      - label: "左"
        text: "左邊"
      - label: "両方"
        text: "兩邊"
  - id: "side_tinnitus"
    text: "是哪一邊的耳朵耳鳴？"
    options:
      - label: "右"
        text: "右邊"
      - label: "左"
        text: "左邊"
      - label: "両方"
        text: "兩邊"
  - id: "side_ear_pain"
    text: "是哪一邊的耳朵痛？"
    options:
      - label: "右"
        text: "右邊"
      - label: "左"
        text: "左邊"
      - label: "両方"
        text: "兩邊"
  - id: "side_otorrhea"
    text: "是哪一邊的耳朵流出分泌物？"
    options:
      - label: "右"
        text: "右邊"
      - label: "左"
        text: "左邊"
      - label: "両方"
        text: "兩邊"
  - id: "side_ear_fullness"
    text: "是哪一邊的耳朵有悶塞的感覺？"
    options:
      - label: "右"
        text: "右邊"
      - label: "左"
        text: "左邊"
      - label: "両方"
        text: "兩邊"
  - id: "onset"
    text: "這些症狀大約是從什麼時候開始的？"
    options:
      - label: "今日から"
        text: "從今天開始"
      - label: "昨日から"
        text: "從昨天開始"
      - label: "2〜3日前から"
        text: "從2～3天前開始"
      - label: "1週間くらい前から"
        text: "從大約1週前開始"
      - label: "2〜3週間前から"
        text: "從2～3週前開始"
      - label: "1か月くらい前から"
        text: "從大約1個月前開始"
      - label: "2〜3か月前から"
        text: "從2～3個月前開始"
      - label: "半年くらい前から"
        text: "從大約半年前開始"
      - label: "1年以上前から"
        text: "從1年多以前開始"
      - label: "わからない"
        text: "不知道"
  - id: "onset_time"
    text: "這些症狀大約是在什麼時段開始的？"
    options:
      - label: "朝"
        text: "早上"
      - label: "昼"
        text: "中午"
      - label: "夕方"
        text: "傍晚"
      - label: "夜"
        text: "晚上"
      - label: "夜中"
        text: "半夜"
      - label: "わからない"
        text: "不知道"
  - id: "allergy_food"
    text: "您有食物過敏嗎？"
    options:
      - label: "ある"
        text: "有"
      - label: "ない"
        text: "沒有"
      - label: "わからない"
        text: "不知道"
  - id: "allergy_food_items"
    text: "請選出所有會讓您過敏的食物。"
    options:
      - label: "卵"
        text: "蛋"
      - label: "牛乳"
        text: "牛奶"
      - label: "小麦"
        text: "小麥"
      - label: "そば"
        text: "蕎麥"
      - label: "落花生（ピーナッツ）"
        text: "花生"
      - label: "えび・かに"
        text: "蝦子、螃蟹"
      - label: "魚"
        text: "魚"
      - label: "果物"
        text: "水果"
      - label: "大豆"
        text: "黃豆"
      - label: "その他"
        text: "其他"
        detail: "請告訴我們食物的名稱"
  - id: "allergy_drug"
    text: "您是否對藥物過敏，或曾經因為藥物而身體不舒服？"
    options:
      - label: "ある"
        text: "有"
        detail: "請告訴我們藥物的名稱"
      - label: "ない"
        text: "沒有"
      - label: "わからない"
        text: "不知道"
  - id: "current_visit"
    text: "您目前是否在其他醫院看診？"
    options:
      - label: "通院している"
        text: "有在看診"
        detail: "請告訴我們疾病的名稱"
      - label: "通院していない"
        text: "沒有看診"
  - id: "current_meds"
    text: "您目前有在吃的藥嗎？"
    hint: "如果您有「用藥手冊」（お薬手帳），看診時請拿給醫師看。"
    options:
      - label: "のんでいる"
        text: "有在吃"
        detail: "請告訴我們藥物的名稱"
      - label: "のんでいない"
        text: "沒有吃"
  - id: "pregnancy"
    text: "您目前是否懷孕中或哺乳中？"
    options:
      - label: "妊娠中"
        text: "懷孕中"
      - label: "授乳中"
        text: "哺乳中"
      - label: "妊娠していない"
        text: "沒有懷孕"
      - label: "わからない"
        text: "不知道"
  - id: "pregnancy_weeks"
    text: "您懷孕幾週了？"
    hint: "如果不知道，請直接進入下一題。"
    unit: "週"
