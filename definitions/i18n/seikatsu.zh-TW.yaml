# 「生活習慣病管理料 対象患者様 アンケート」の 繁體中文 の画面（患者さんに見せる言葉の訳）。
# Claude が訳し、人が確かめて公開したもの。label はもとの日本語（変えない）。訳は text と detail。
# 問診票の言葉を変えたら、この訳は使われなくなる（作る画面の「外国語」で作り直す）。
id: "seikatsu"
lang: "zh-TW"
key: "bf04cc352ab0"
title: "生活習慣病管理費 適用患者問卷"
questions:
  - id: "meal_balance"
    text: "您是否一天吃三餐，而且飲食均衡？"
    options:
      - label: "はい"
        text: "是"
      - label: "いいえ"
        text: "否"
  - id: "vegetable_freq"
    text: "您每週大約吃幾次蔬菜、菇類、海藻等？"
    options:
      - label: "週に5〜7回"
        text: "每週5～7次"
      - label: "週に3〜5回"
        text: "每週3～5次"
      - label: "週に0〜2回"
        text: "每週0～2次"
  - id: "fried_food_freq"
    text: "您每週大約吃幾次油炸食物？"
    options:
      - label: "週に0〜2回"
        text: "每週0～2次"
      - label: "週に3〜5回"
        text: "每週3～5次"
      - label: "週に5〜7回"
        text: "每週5～7次"
  - id: "alcohol_freq"
    text: "您每週大約喝幾次酒？"
    options:
      - label: "週に0〜3回"
        text: "每週0～3次"
      - label: "週に4〜6回"
        text: "每週4～6次"
      - label: "週に7回"
        text: "每週7次"
  - id: "snack_freq"
    text: "您一天吃幾次點心（零食）？"
    options:
      - label: "0回"
        text: "0次"
      - label: "1回"
        text: "1次"
      - label: "2回以上"
        text: "2次以上"
  - id: "meal_count"
    text: "您一天吃幾餐？"
    options:
      - label: "3回"
        text: "3次"
      - label: "1〜2回"
        text: "1～2次"
      - label: "4回以上"
        text: "4次以上"
  - id: "salty_food"
    text: "您吃重口味食物的量，比較接近哪一個？"
    options:
      - label: "少ない"
        text: "少"
      - label: "多い"
        text: "多"
  - id: "eating_out_freq"
    text: "您每週大約外食幾次？"
    options:
      - label: "週に0回"
        text: "每週0次"
      - label: "週に1〜2回"
        text: "每週1～2次"
      - label: "週に3回以上"
        text: "每週3次以上"
  - id: "bento_freq"
    text: "您每週大約吃幾次便當或熟食小菜？"
    options:
      - label: "週に0〜1回"
        text: "每週0～1次"
      - label: "週に2〜4回"
        text: "每週2～4次"
      - label: "週に5回以上"
        text: "每週5次以上"
  - id: "bread_freq"
    text: "您每週大約吃幾次麵包？"
    options:
      - label: "週に0〜1回"
        text: "每週0～1次"
      - label: "週に2〜4回"
        text: "每週2～4次"
      - label: "週に5回以上"
        text: "每週5次以上"
  - id: "noodle_freq"
    text: "您每週大約吃幾次麵類？"
    options:
      - label: "週に0〜1回"
        text: "每週0～1次"
      - label: "週に2〜4回"
        text: "每週2～4次"
      - label: "週に5回以上"
        text: "每週5次以上"
  - id: "exercise_habit"
    text: "您是否每週2天以上、每次30分鐘以上，做會微微流汗的運動，並已持續1年以上？"
    options:
      - label: "はい"
        text: "是"
      - label: "いいえ"
        text: "否"
  - id: "daily_activity"
    text: "在日常生活中，您是否每天走路或做差不多程度的身體活動1小時以上？"
    options:
      - label: "はい"
        text: "是"
      - label: "いいえ"
        text: "否"
  - id: "daytime_sleepiness"
    text: "您白天是否常常會想睡？"
    options:
      - label: "いいえ"
        text: "否"
      - label: "はい"
        text: "是"
  - id: "daytime_headache"
    text: "您白天是否常常會頭痛？"
    options:
      - label: "いいえ"
        text: "否"
      - label: "はい"
        text: "是"
  - id: "eye_exam"
    text: "最近1年內，您是否看過眼科？"
    options:
      - label: "はい"
        text: "是"
      - label: "いいえ"
        text: "否"
  - id: "dental_visit"
    text: "最近1年內，您是否看過牙醫？"
    options:
      - label: "はい"
        text: "是"
      - label: "いいえ"
        text: "否"
  - id: "smoking"
    text: "您目前是否有吸菸的習慣？"
    hint: "參考標準：至今累計吸菸100支以上，或已吸菸6個月以上，且最近1個月內也有吸菸，請選「是」。"
    options:
      - label: "いいえ"
        text: "否"
      - label: "はい"
        text: "是"
  - id: "smoking_cessation_clinic"
    text: "您是否希望看戒菸門診（幫助您戒菸的門診）？"
    options:
      - label: "いいえ"
        text: "否"
      - label: "はい"
        text: "是"
