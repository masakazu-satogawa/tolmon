# 「内科 初診問診票」の English の画面（患者さんに見せる言葉の訳）。
# Claude が訳し、人が確かめて公開したもの。label はもとの日本語（変えない）。訳は text と detail。
# 問診票の言葉を変えたら、この訳は使われなくなる（作る画面の「外国語」で作り直す）。
id: "naika"
lang: "en"
key: "e70950652e6f"
title: "Internal Medicine: First Visit Questionnaire"
questions:
  - id: "age"
    text: "How old are you?"
    unit: "years old"
  - id: "sex"
    text: "What is your sex?"
    options:
      - label: "男性"
        text: "Male"
      - label: "女性"
        text: "Female"
  - id: "myna_consent"
    text: "With your My Number Card health insurance card (Myna insurance card), did you agree to let the hospital see your medical information?"
    options:
      - label: "はい"
        text: "Yes"
      - label: "いいえ"
        text: "No"
  - id: "temp_now"
    text: "What is your body temperature now?"
    hint: "If you have not measured your temperature, please skip this question."
    unit: "℃"
  - id: "temp_max"
    text: "Since these symptoms started, what was your highest body temperature?"
    hint: "If you have not measured your temperature, please skip this question."
    unit: "℃"
  - id: "temp_max_date"
    text: "When was your temperature the highest?"
    options:
      - label: "今日"
        text: "Today"
      - label: "昨日"
        text: "Yesterday"
      - label: "おととい"
        text: "2 days ago"
      - label: "3日以上前"
        text: "3 or more days ago"
      - label: "わからない"
        text: "I don't know"
  - id: "symptoms"
    text: "What are your symptoms? Please choose all that apply, including what you want to talk to us about."
    options:
      - label: "熱がある"
        text: "I have a fever"
      - label: "せき・たん"
        text: "Cough / phlegm"
      - label: "のどが痛い"
        text: "Sore throat"
      - label: "頭が痛い"
        text: "Headache"
      - label: "おなかが痛い"
        text: "Stomach pain"
      - label: "胸が痛い・どうきがする"
        text: "Chest pain / pounding heart"
      - label: "息苦しい"
        text: "Hard to breathe"
      - label: "睡眠時無呼吸の相談"
        text: "Advice about sleep apnea (breathing stops during sleep)"
      - label: "禁煙の相談"
        text: "Advice about quitting smoking"
      - label: "健康診断の精密検査の相談"
        text: "Advice about follow-up tests after a health checkup"
      - label: "飲み込みの相談"
        text: "Advice about swallowing"
      - label: "骨粗しょう症の相談"
        text: "Advice about osteoporosis (weak bones)"
      - label: "物忘れの相談"
        text: "Advice about forgetfulness"
      - label: "その他"
        text: "Other"
        detail: "Please tell us about any other symptoms"
  - id: "last_meal"
    text: "About what time (hour and minute) did you last eat?"
  - id: "onset"
    text: "About when did the symptoms start?"
    options:
      - label: "今日から"
        text: "Today"
      - label: "昨日から"
        text: "Yesterday"
      - label: "2〜3日前から"
        text: "2–3 days ago"
      - label: "1週間くらい前から"
        text: "About 1 week ago"
      - label: "2〜3週間前から"
        text: "2–3 weeks ago"
      - label: "1か月くらい前から"
        text: "About 1 month ago"
      - label: "2〜3か月前から"
        text: "2–3 months ago"
      - label: "半年くらい前から"
        text: "About 6 months ago"
      - label: "1年以上前から"
        text: "1 year ago or more"
      - label: "わからない"
        text: "I don't know"
  - id: "onset_time"
    text: "About what time of day did the symptoms start?"
    options:
      - label: "朝"
        text: "Morning"
      - label: "昼"
        text: "Midday"
      - label: "夕方"
        text: "Evening"
      - label: "夜"
        text: "Night"
      - label: "夜中"
        text: "Middle of the night"
      - label: "わからない"
        text: "I don't know"
  - id: "allergy_food"
    text: "Do you have any food allergies?"
    options:
      - label: "ある"
        text: "Yes"
      - label: "ない"
        text: "No"
      - label: "わからない"
        text: "I don't know"
  - id: "allergy_food_items"
    text: "Please choose all foods you are allergic to."
    options:
      - label: "卵"
        text: "Eggs"
      - label: "牛乳"
        text: "Milk"
      - label: "その他"
        text: "Other"
        detail: "Please tell us the name of the food"
  - id: "allergy_drug"
    text: "Do you have any medicine allergies, or have you ever had a bad reaction to a medicine?"
    options:
      - label: "ある"
        text: "Yes"
        detail: "Please tell us the name of the medicine"
      - label: "ない"
        text: "No"
      - label: "わからない"
        text: "I don't know"
  - id: "history"
    text: "Have you ever had surgery or medical treatment, or are you now going to another hospital?"
    options:
      - label: "はい"
        text: "Yes"
        detail: "Please tell us the name of the illness and about when (example: high blood pressure, seeing a doctor for 10 years; stomach surgery in 2015)"
      - label: "いいえ"
        text: "No"
  - id: "medication"
    text: "Are you taking any medicine now?"
    options:
      - label: "ある"
        text: "Yes"
        detail: "Please tell us the name of the medicine"
      - label: "ない"
        text: "No"
      - label: "わからない"
        text: "I don't know"
  - id: "smoking"
    text: "Do you smoke?"
    options:
      - label: "今、吸っている"
        text: "Yes, I smoke now"
      - label: "以前は吸っていた"
        text: "I used to smoke"
      - label: "吸わない"
        text: "I don't smoke"
  - id: "smoking_per_day"
    text: "About how many cigarettes do you (or did you) smoke a day?"
    unit: "cigarettes"
  - id: "smoking_years"
    text: "For about how many years have you smoked (or did you smoke)?"
    unit: "years"
  - id: "alcohol"
    text: "How often do you drink alcohol?"
    options:
      - label: "毎日"
        text: "Every day"
      - label: "週に何日か飲む"
        text: "Some days a week"
      - label: "飲まない"
        text: "I don't drink"
  - id: "alcohol_days"
    text: "How many days a week do you drink alcohol?"
    unit: "days"
  - id: "alcohol_amount"
    text: "Please choose all the kinds of alcohol you usually drink on one occasion."
    options:
      - label: "ビール"
        text: "Beer"
        detail: "Amount at one time (example: 1 medium bottle = 500 mL, 2 cans of 350 mL)"
      - label: "日本酒"
        text: "Sake"
        detail: "Amount at one time (example: 1 go = 180 mL)"
      - label: "焼酎"
        text: "Shochu"
        detail: "Amount at one time (example: 1 glass)"
      - label: "ワイン"
        text: "Wine"
        detail: "Amount at one time (example: 2 glasses)"
      - label: "ウイスキー"
        text: "Whiskey"
        detail: "Amount at one time (example: 1 double)"
      - label: "チューハイ・サワー"
        text: "Chuhai / sour"
        detail: "Amount at one time (example: 1 can of 350 mL)"
      - label: "その他"
        text: "Other"
        detail: "Kind of alcohol and amount at one time"
  - id: "pregnancy"
    text: "Are you pregnant or breastfeeding now?"
    options:
      - label: "妊娠中"
        text: "Pregnant"
      - label: "授乳中"
        text: "Breastfeeding"
      - label: "妊娠していない"
        text: "Not pregnant"
      - label: "わからない"
        text: "I don't know"
  - id: "pregnancy_weeks"
    text: "How many weeks pregnant are you?"
    unit: "weeks"
  - id: "doctor_request"
    text: "Is there a doctor you would like to see you?"
    options:
      - label: "希望はない"
        text: "No preference"
      - label: "希望する医師がいる"
        text: "Yes, I have a doctor in mind"
        detail: "Please tell us the doctor's name"
