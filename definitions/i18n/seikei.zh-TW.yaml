# 「整形・外科 初診問診票」の 繁體中文 の画面（患者さんに見せる言葉の訳）。
# Claude が訳し、人が確かめて公開したもの。label はもとの日本語（変えない）。訳は text と detail。
# 問診票の言葉を変えたら、この訳は使われなくなる（作る画面の「外国語」で作り直す）。
id: "seikei"
lang: "zh-TW"
key: "e8dffad07787"
title: "骨科・外科 初診問診表"
questions:
  - id: "age"
    text: "請告訴我們您的年齡。"
    unit: "歲"
  - id: "sex"
    text: "請告訴我們您的性別。"
    options:
      - label: "男性"
        text: "男性"
      - label: "女性"
        text: "女性"
  - id: "myna_consent"
    text: "您是否已在 My Number 健保卡（日本的個人編號卡兼健保卡）上，同意讓醫院查看您的就醫資訊？"
    options:
      - label: "はい"
        text: "是"
      - label: "いいえ"
        text: "否"
  - id: "temp_now"
    text: "請告訴我們您現在的體溫。"
    unit: "℃"
  - id: "temp_max"
    text: "請告訴我們您最近最高的體溫。"
    unit: "℃"
  - id: "temp_max_when"
    text: "您的體溫最高是在什麼時候？"
    options:
      - label: "今日"
        text: "今天"
      - label: "昨日"
        text: "昨天"
      - label: "おととい"
        text: "前天"
      - label: "3日以上前"
        text: "3天前或更早"
      - label: "わからない"
        text: "不知道"
  - id: "site"
    text: "請在身體圖上告訴我們有症狀的部位。"
  - id: "symptoms"
    text: "是什麼樣的症狀？請選出所有符合的項目。"
    options:
      - label: "痛い"
        text: "會痛"
      - label: "しびれる"
        text: "發麻"
      - label: "腫れ"
        text: "腫脹"
      - label: "動きにくい"
        text: "活動不便"
      - label: "熱がある"
        text: "發熱"
      - label: "つっぱる"
        text: "緊繃"
      - label: "こわばる"
        text: "僵硬"
      - label: "何か出来ている"
        text: "長了東西"
      - label: "その他"
        text: "其他"
        detail: "請告訴我們是什麼樣的症狀"
  - id: "onset"
    text: "這次的症狀大約是從什麼時候開始的？"
    options:
      - label: "今日から"
        text: "從今天開始"
      - label: "昨日から"
        text: "從昨天開始"
      - label: "2〜3日前から"
        text: "從2～3天前開始"
      - label: "1週間くらい前から"
        text: "從大約1週前開始"
      - label: "2〜3週間前から"
        text: "從2～3週前開始"
      - label: "1か月くらい前から"
        text: "從大約1個月前開始"
      - label: "2〜3か月前から"
        text: "從2～3個月前開始"
      - label: "半年くらい前から"
        text: "從大約半年前開始"
      - label: "1年以上前から"
        text: "從1年多以前開始"
      - label: "わからない"
        text: "不知道"
  - id: "cause"
    text: "您是否想得到造成症狀的原因？請選出所有符合的項目。"
    options:
      - label: "転んだ"
        text: "跌倒"
      - label: "ぶつけた"
        text: "撞到"
      - label: "ひねった"
        text: "扭到"
      - label: "重い物を持った"
        text: "搬重物"
      - label: "スポーツ中"
        text: "運動時"
      - label: "仕事中"
        text: "工作時"
      - label: "交通事故"
        text: "車禍"
      - label: "同じ動作のくり返し"
        text: "重複同樣的動作"
      - label: "思い当たらない"
        text: "想不到原因"
      - label: "その他"
        text: "其他"
        detail: "請盡量詳細告訴我們您想到的原因"
  - id: "past_illness"
    text: "您以前是否得過以下疾病？請選出所有符合的項目。"
    options:
      - label: "かかったことはない"
        text: "沒有得過"
      - label: "喘息"
        text: "氣喘"
      - label: "じんましんなどのアレルギーの病気"
        text: "蕁麻疹等過敏疾病"
      - label: "心臓病"
        text: "心臟病"
      - label: "高血圧"
        text: "高血壓"
      - label: "腎臓病"
        text: "腎臟病"
      - label: "肝臓病"
        text: "肝臟病"
      - label: "糖尿病"
        text: "糖尿病"
      - label: "胃潰瘍"
        text: "胃潰瘍"
      - label: "十二指腸潰瘍"
        text: "十二指腸潰瘍"
      - label: "その他"
        text: "其他"
        detail: "請告訴我們疾病名稱"
  - id: "current_treatment"
    text: "您現在有正在治療的疾病嗎？"
    options:
      - label: "ある"
        text: "有"
        detail: "請告訴我們疾病名稱"
      - label: "ない"
        text: "沒有"
  - id: "drug_reaction"
    text: "您是否曾經吃藥後身體不舒服？"
    options:
      - label: "ある"
        text: "有"
        detail: "請告訴我們藥名，以及當時出現了什麼情況"
      - label: "ない"
        text: "沒有"
      - label: "薬をあまり飲んだことがないので分からない"
        text: "很少吃藥，所以不知道"
  - id: "pregnancy"
    text: "您現在是否懷孕或正在哺乳？"
    options:
      - label: "妊娠中"
        text: "懷孕中"
      - label: "授乳中"
        text: "哺乳中"
      - label: "妊娠していない"
        text: "沒有懷孕"
      - label: "分からない"
        text: "不知道"
  - id: "grade"
    text: "如果您是學生，請告訴我們您的年級（依日本學制）。"
    options:
      - label: "学生ではない"
        text: "不是學生"
      - label: "小学1年"
        text: "小學1年級"
      - label: "小学2年"
        text: "小學2年級"
      - label: "小学3年"
        text: "小學3年級"
      - label: "小学4年"
        text: "小學4年級"
      - label: "小学5年"
        text: "小學5年級"
      - label: "小学6年"
        text: "小學6年級"
      - label: "中学1年"
        text: "國中1年級"
      - label: "中学2年"
        text: "國中2年級"
      - label: "中学3年"
        text: "國中3年級"
      - label: "高校1年"
        text: "高中1年級"
      - label: "高校2年"
        text: "高中2年級"
      - label: "高校3年"
        text: "高中3年級"
      - label: "大学・専門学校"
        text: "大學・專科學校（日本的專門學校）"
  - id: "club"
    text: "您在學校參加什麼社團活動？"
    options:
      - label: "野球"
        text: "棒球"
      - label: "サッカー"
        text: "足球"
      - label: "バスケットボール"
        text: "籃球"
      - label: "バレーボール"
        text: "排球"
      - label: "テニス"
        text: "網球"
      - label: "卓球"
        text: "桌球"
      - label: "陸上"
        text: "田徑"
      - label: "水泳"
        text: "游泳"
      - label: "柔道・剣道"
        text: "柔道・劍道"
      - label: "文化部"
        text: "文藝類社團"
      - label: "していない"
        text: "沒有參加"
      - label: "その他"
        text: "其他"
        detail: "請告訴我們社團名稱"
