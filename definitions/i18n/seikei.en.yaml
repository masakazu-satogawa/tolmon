# 「整形・外科 初診問診票」の English の画面（患者さんに見せる言葉の訳）。
# Claude が訳し、人が確かめて公開したもの。label はもとの日本語（変えない）。訳は text と detail。
# 問診票の言葉を変えたら、この訳は使われなくなる（作る画面の「外国語」で作り直す）。
id: "seikei"
lang: "en"
key: "e8dffad07787"
title: "Orthopedics and Surgery: First Visit Questionnaire"
questions:
  - id: "age"
    text: "How old are you?"
    unit: "years old"
  - id: "sex"
    text: "What is your sex?"
    options:
      - label: "男性"
        text: "Male"
      - label: "女性"
        text: "Female"
  - id: "myna_consent"
    text: "With your My Number health insurance card, did you agree to let us see your medical information?"
    options:
      - label: "はい"
        text: "Yes"
      - label: "いいえ"
        text: "No"
  - id: "temp_now"
    text: "What is your body temperature now?"
    unit: "℃"
  - id: "temp_max"
    text: "What was your highest body temperature recently?"
    unit: "℃"
  - id: "temp_max_when"
    text: "When was your temperature the highest?"
    options:
      - label: "今日"
        text: "Today"
      - label: "昨日"
        text: "Yesterday"
      - label: "おととい"
        text: "2 days ago"
      - label: "3日以上前"
        text: "3 or more days ago"
      - label: "わからない"
        text: "I don't know"
  - id: "site"
    text: "Please show where you have symptoms on the body picture."
  - id: "symptoms"
    text: "What are your symptoms? Choose all that apply."
    options:
      - label: "痛い"
        text: "Pain"
      - label: "しびれる"
        text: "Numbness"
      - label: "腫れ"
        text: "Swelling"
      - label: "動きにくい"
        text: "Hard to move"
      - label: "熱がある"
        text: "Fever"
      - label: "つっぱる"
        text: "Feels tight"
      - label: "こわばる"
        text: "Stiffness"
      - label: "何か出来ている"
        text: "A lump or bump"
      - label: "その他"
        text: "Other"
        detail: "Please tell us what your symptoms are"
  - id: "onset"
    text: "When did these symptoms start?"
    options:
      - label: "今日から"
        text: "Today"
      - label: "昨日から"
        text: "Yesterday"
      - label: "2〜3日前から"
        text: "2–3 days ago"
      - label: "1週間くらい前から"
        text: "About 1 week ago"
      - label: "2〜3週間前から"
        text: "2–3 weeks ago"
      - label: "1か月くらい前から"
        text: "About 1 month ago"
      - label: "2〜3か月前から"
        text: "2–3 months ago"
      - label: "半年くらい前から"
        text: "About 6 months ago"
      - label: "1年以上前から"
        text: "1 year ago or more"
      - label: "わからない"
        text: "I don't know"
  - id: "cause"
    text: "Do you know what may have caused your symptoms? Choose all that apply."
    options:
      - label: "転んだ"
        text: "I fell"
      - label: "ぶつけた"
        text: "I hit it"
      - label: "ひねった"
        text: "I twisted it"
      - label: "重い物を持った"
        text: "I lifted something heavy"
      - label: "スポーツ中"
        text: "During sports"
      - label: "仕事中"
        text: "During work"
      - label: "交通事故"
        text: "Traffic accident"
      - label: "同じ動作のくり返し"
        text: "Doing the same movement many times"
      - label: "思い当たらない"
        text: "I can't think of a cause"
      - label: "その他"
        text: "Other"
        detail: "Please tell us the possible cause in as much detail as you can"
  - id: "past_illness"
    text: "Have you ever had any of these illnesses? Choose all that apply."
    options:
      - label: "かかったことはない"
        text: "I have never had any of these"
      - label: "喘息"
        text: "Asthma"
      - label: "じんましんなどのアレルギーの病気"
        text: "Allergies, such as hives"
      - label: "心臓病"
        text: "Heart disease"
      - label: "高血圧"
        text: "High blood pressure"
      - label: "腎臓病"
        text: "Kidney disease"
      - label: "肝臓病"
        text: "Liver disease"
      - label: "糖尿病"
        text: "Diabetes"
      - label: "胃潰瘍"
        text: "Stomach ulcer"
      - label: "十二指腸潰瘍"
        text: "Duodenal ulcer"
      - label: "その他"
        text: "Other"
        detail: "Please tell us the name of the illness"
  - id: "current_treatment"
    text: "Are you being treated for any illness now?"
    options:
      - label: "ある"
        text: "Yes"
        detail: "Please tell us the name of the illness"
      - label: "ない"
        text: "No"
  - id: "drug_reaction"
    text: "Have you ever had a bad reaction after taking a medicine?"
    options:
      - label: "ある"
        text: "Yes"
        detail: "Please tell us the name of the medicine and what happened"
      - label: "ない"
        text: "No"
      - label: "薬をあまり飲んだことがないので分からない"
        text: "I don't know, because I have rarely taken medicine"
  - id: "pregnancy"
    text: "Are you pregnant or breastfeeding now?"
    options:
      - label: "妊娠中"
        text: "Pregnant"
      - label: "授乳中"
        text: "Breastfeeding"
      - label: "妊娠していない"
        text: "Not pregnant"
      - label: "分からない"
        text: "I don't know"
  - id: "grade"
    text: "If you are a student, what grade are you in?"
    options:
      - label: "学生ではない"
        text: "Not a student"
      - label: "小学1年"
        text: "Elementary school, year 1"
      - label: "小学2年"
        text: "Elementary school, year 2"
      - label: "小学3年"
        text: "Elementary school, year 3"
      - label: "小学4年"
        text: "Elementary school, year 4"
      - label: "小学5年"
        text: "Elementary school, year 5"
      - label: "小学6年"
        text: "Elementary school, year 6"
      - label: "中学1年"
        text: "Junior high school, year 1"
      - label: "中学2年"
        text: "Junior high school, year 2"
      - label: "中学3年"
        text: "Junior high school, year 3"
      - label: "高校1年"
        text: "High school, year 1"
      - label: "高校2年"
        text: "High school, year 2"
      - label: "高校3年"
        text: "High school, year 3"
      - label: "大学・専門学校"
        text: "College or vocational school"
  - id: "club"
    text: "What school club are you in?"
    options:
      - label: "野球"
        text: "Baseball"
      - label: "サッカー"
        text: "Soccer"
      - label: "バスケットボール"
        text: "Basketball"
      - label: "バレーボール"
        text: "Volleyball"
      - label: "テニス"
        text: "Tennis"
      - label: "卓球"
        text: "Table tennis"
      - label: "陸上"
        text: "Track and field"
      - label: "水泳"
        text: "Swimming"
      - label: "柔道・剣道"
        text: "Judo or kendo"
      - label: "文化部"
        text: "Non-sports club (arts, music, etc.)"
      - label: "していない"
        text: "None"
      - label: "その他"
        text: "Other"
        detail: "Please tell us the name of your club"
