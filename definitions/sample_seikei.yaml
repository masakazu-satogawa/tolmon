# 架空のサンプル問診票（整形外科・デモ用）。人体シェーマ（type: body）の確認用。
id: "sample_seikei"
title: "整形外科 初診問診票（サンプル）"
version: 1
questions:
  - id: "sex"
    type: "single"
    text: "性別を教えてください"
    karte: "性別"
    tag: "基本情報"
    options:
      - label: "男性"
        karte: "男性"
      - label: "女性"
        karte: "女性"
  - id: "age"
    type: "number"
    text: "年齢を教えてください"
    karte: "年齢"
    tag: "基本情報"
    unit: "歳"
    min: 0
    max: 120
  - id: "site"
    type: "body"
    text: "症状のあるところを、図をタップして教えてください"
    hint: "いくつでも選べます。もう一度タップすると消えます"
    karte: "症状のある部位"
    tag: "現病歴"
    required: true
  - id: "symptom"
    type: "multi"
    text: "それは、どのような症状ですか？（いくつでも）"
    karte: "症状"
    tag: "主訴"
    required: true
    options:
      - label: "痛い"
        karte: "疼痛"
      - label: "しびれる"
        karte: "しびれ"
      - label: "腫れている"
        karte: "腫脹"
      - label: "動きにくい"
        karte: "可動域制限"
      - label: "熱をもっている"
        karte: "熱感"
      - label: "つっぱる"
        karte: "つっぱり感"
      - label: "こわばる"
        karte: "こわばり"
      - label: "何かできている"
        karte: "腫瘤・皮疹"
      - label: "その他"
        karte: "その他"
        detail: "どのような症状か書いてください"
  - id: "onset"
    type: "text"
    text: "今回の症状は、いつ頃からですか？"
    karte: "発症時期"
    tag: "現病歴"
    hint: "例：3日前から、先月のはじめから"
  - id: "cause"
    type: "single"
    text: "思い当たる原因はありますか？"
    karte: "原因"
    tag: "現病歴"
    options:
      - label: "交通事故"
        karte: "交通事故"
        detail: "いつ、どのような事故か書いてください"
      - label: "仕事中のけが"
        karte: "労災"
        detail: "いつ、どのようなけがか書いてください"
      - label: "転んだ・ぶつけた"
        karte: "転倒・打撲"
        detail: "いつ、どこで"
      - label: "特にない"
        karte: "誘因なし"
      - label: "その他"
        karte: "その他"
        detail: "できるだけ詳しく書いてください"
  - id: "history"
    type: "multi"
    text: "次の病気にかかったことはありますか？（いくつでも）"
    karte: "既往歴"
    tag: "既往歴"
    options:
      - label: "ぜんそく"
        karte: "喘息"
      - label: "じんましん・アレルギーの病気"
        karte: "アレルギー疾患"
      - label: "心臓病"
        karte: "心疾患"
      - label: "高血圧"
        karte: "高血圧"
      - label: "腎臓病"
        karte: "腎疾患"
      - label: "肝臓病"
        karte: "肝疾患"
      - label: "糖尿病"
        karte: "糖尿病"
      - label: "胃潰瘍・十二指腸潰瘍"
        karte: "消化性潰瘍"
      - label: "その他"
        karte: "その他"
        detail: "病気の名前を書いてください"
      - label: "特にない"
        karte: "特記なし"
  - id: "meds"
    type: "single"
    text: "いま治療中の病気や、飲んでいるお薬はありますか？"
    karte: "治療中・内服薬"
    tag: "内服薬"
    options:
      - label: "ある"
        karte: "あり"
        detail: "病気の名前・お薬の名前を書いてください"
      - label: "ない"
        karte: "なし"
  - id: "allergy_drug"
    type: "single"
    text: "お薬で具合が悪くなったことはありますか？"
    karte: "薬剤副作用歴"
    tag: "アレルギー"
    options:
      - label: "ある"
        karte: "あり"
        detail: "お薬の名前を書いてください"
      - label: "ない"
        karte: "なし"
      - label: "お薬をあまり飲んだことがないのでわからない"
        karte: "不明（内服歴ほぼなし）"
  - id: "pregnant"
    type: "single"
    text: "現在、妊娠中または授乳中ですか？"
    karte: "妊娠・授乳"
    tag: "その他"
    show_if:
      all:
        - q: "sex"
          ne: "男性"
        - q: "age"
          lt: 50
    options:
      - label: "妊娠中"
        karte: "妊娠中"
      - label: "授乳中"
        karte: "授乳中"
      - label: "どちらでもない"
        karte: "該当なし"
      - label: "わからない"
        karte: "不明"
