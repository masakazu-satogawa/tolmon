# トルモンの問診定義。白紙の問診票から Claude が下書きを作り、人が確認して確定したもの。
# もとの帳票: 耳鼻咽喉科.pdf
# 書き方は CLAUDE.md「4. 問診定義」を参照。
id: "jibi"
title: "耳鼻咽喉科 初診問診票"
version: 1
questions:
  - id: "age"
    type: "number"
    text: "年齢を教えてください。"
    karte: "年齢"
    tag: "基本情報"
    unit: "歳"
  - id: "sex"
    type: "single"
    text: "性別を教えてください。"
    karte: "性別"
    tag: "基本情報"
    options:
      - label: "男性"
      - label: "女性"
  - id: "myna_consent"
    type: "single"
    text: "マイナ保険証で、診療情報を病院が見ることに同意しましたか？"
    karte: "マイナ保険証 診療情報取得同意"
    tag: "その他"
    options:
      - label: "はい"
        karte: "同意あり"
      - label: "いいえ"
        karte: "同意なし"
  - id: "temp_now"
    type: "number"
    text: "今の体温を教えてください。"
    karte: "現在の体温"
    tag: "現病歴"
    hint: "測っていない場合は、そのまま次へ進んでください。"
    unit: "℃"
  - id: "temp_max"
    type: "number"
    text: "今回の症状が出てから、いちばん高かった体温を教えてください。"
    karte: "最高体温"
    tag: "現病歴"
    hint: "測っていない場合は、そのまま次へ進んでください。"
    unit: "℃"
  - id: "temp_max_date"
    type: "single"
    text: "いちばん高い体温だったのは、いつですか？"
    karte: "最高体温の日時"
    tag: "現病歴"
    options:
      - label: "今日"
      - label: "昨日"
      - label: "おととい"
        karte: "一昨日"
      - label: "3日以上前"
      - label: "わからない"
        karte: "不明"
  - id: "symptoms"
    type: "multi"
    text: "どのような症状がありますか？あてはまるものをすべて選んでください。"
    karte: "症状"
    tag: "主訴"
    required: true
    options:
      - label: "めまい"
      - label: "聞こえが悪い"
        karte: "難聴"
      - label: "耳鳴り"
        karte: "耳鳴"
      - label: "耳が痛い"
        karte: "耳痛"
      - label: "耳汁（みみだれ）が出る"
        karte: "耳漏"
      - label: "耳がつまる"
        karte: "耳閉感"
      - label: "鼻がつまる"
        karte: "鼻閉"
      - label: "くしゃみ"
      - label: "鼻水"
        karte: "鼻汁"
      - label: "鼻血"
        karte: "鼻出血"
      - label: "黄色や緑色のどろっとした鼻水"
        karte: "膿性鼻汁"
      - label: "のどが痛い"
        karte: "咽頭痛"
      - label: "のどがつまった感じ"
        karte: "咽頭閉塞感"
      - label: "声がかすれる"
        karte: "嗄声"
      - label: "咳が出る"
        karte: "咳嗽"
      - label: "その他"
        detail: "どのような症状か教えてください"
  - id: "side_hearing"
    type: "single"
    text: "聞こえが悪いのは、どちらの耳ですか？"
    karte: "難聴 左右"
    tag: "主訴"
    options:
      - label: "右"
      - label: "左"
      - label: "両方"
        karte: "両側"
    show_if:
      q: "symptoms"
      eq: "聞こえが悪い"
  - id: "side_tinnitus"
    type: "single"
    text: "耳鳴りがするのは、どちらの耳ですか？"
    karte: "耳鳴 左右"
    tag: "主訴"
    options:
      - label: "右"
      - label: "左"
      - label: "両方"
        karte: "両側"
    show_if:
      q: "symptoms"
      eq: "耳鳴り"
  - id: "side_ear_pain"
    type: "single"
    text: "痛いのは、どちらの耳ですか？"
    karte: "耳痛 左右"
    tag: "主訴"
    options:
      - label: "右"
      - label: "左"
      - label: "両方"
        karte: "両側"
    show_if:
      q: "symptoms"
      eq: "耳が痛い"
  - id: "side_otorrhea"
    type: "single"
    text: "耳汁（みみだれ）が出るのは、どちらの耳ですか？"
    karte: "耳漏 左右"
    tag: "主訴"
    options:
      - label: "右"
      - label: "左"
      - label: "両方"
        karte: "両側"
    show_if:
      q: "symptoms"
      eq: "耳汁（みみだれ）が出る"
  - id: "side_ear_fullness"
    type: "single"
    text: "つまった感じがするのは、どちらの耳ですか？"
    karte: "耳閉感 左右"
    tag: "主訴"
    options:
      - label: "右"
      - label: "左"
      - label: "両方"
        karte: "両側"
    show_if:
      q: "symptoms"
      eq: "耳がつまる"
  - id: "onset"
    type: "single"
    text: "その症状は、いつごろからですか？"
    karte: "発症時期"
    tag: "現病歴"
    options:
      - label: "今日から"
      - label: "昨日から"
      - label: "2〜3日前から"
      - label: "1週間くらい前から"
        karte: "1週間前頃から"
      - label: "2〜3週間前から"
      - label: "1か月くらい前から"
        karte: "1か月前頃から"
      - label: "2〜3か月前から"
      - label: "半年くらい前から"
        karte: "半年前頃から"
      - label: "1年以上前から"
      - label: "わからない"
        karte: "不明"
  - id: "onset_time"
    type: "single"
    text: "その症状は、何時ごろから始まりましたか？"
    karte: "発症時刻（時間帯）"
    tag: "現病歴"
    options:
      - label: "朝"
      - label: "昼"
      - label: "夕方"
      - label: "夜"
      - label: "夜中"
        karte: "夜間"
      - label: "わからない"
        karte: "不明"
    show_if:
      any:
        - q: "onset"
          eq: "今日から"
        - q: "onset"
          eq: "昨日から"
  - id: "allergy_food"
    type: "single"
    text: "食べ物のアレルギーはありますか？"
    karte: "食物アレルギー"
    tag: "アレルギー"
    options:
      - label: "ある"
        karte: "あり"
      - label: "ない"
        karte: "なし"
      - label: "わからない"
        karte: "不明"
  - id: "allergy_food_items"
    type: "multi"
    text: "アレルギーのある食べ物を、すべて選んでください。"
    karte: "食物アレルギー 原因食品"
    tag: "アレルギー"
    options:
      - label: "卵"
      - label: "牛乳"
      - label: "小麦"
      - label: "そば"
      - label: "落花生（ピーナッツ）"
        karte: "落花生"
      - label: "えび・かに"
        karte: "甲殻類（えび・かに）"
      - label: "魚"
      - label: "果物"
      - label: "大豆"
      - label: "その他"
        detail: "食べ物の名前を教えてください"
    show_if:
      q: "allergy_food"
      eq: "ある"
  - id: "allergy_drug"
    type: "single"
    text: "薬のアレルギーや、薬で具合が悪くなったことはありますか？"
    karte: "薬剤アレルギー・副作用歴"
    tag: "アレルギー"
    options:
      - label: "ある"
        karte: "あり"
        detail: "薬の名前を教えてください"
      - label: "ない"
        karte: "なし"
      - label: "わからない"
        karte: "不明"
  - id: "current_visit"
    type: "single"
    text: "今、ほかの病院に通院していますか？"
    karte: "通院中の疾患"
    tag: "既往歴"
    options:
      - label: "通院している"
        karte: "通院あり"
        detail: "病気の名前を教えてください"
      - label: "通院していない"
        karte: "通院なし"
  - id: "current_meds"
    type: "single"
    text: "今、のんでいる薬はありますか？"
    karte: "内服薬"
    tag: "内服薬"
    hint: "お薬手帳があれば、診察のときに見せてください。"
    options:
      - label: "のんでいる"
        karte: "内服あり"
        detail: "薬の名前を教えてください"
      - label: "のんでいない"
        karte: "内服なし"
  - id: "pregnancy"
    type: "single"
    text: "今、妊娠中、または授乳中ですか？"
    karte: "妊娠・授乳"
    tag: "基本情報"
    options:
      - label: "妊娠中"
      - label: "授乳中"
      - label: "妊娠していない"
        karte: "妊娠なし"
      - label: "わからない"
        karte: "不明"
    show_if:
      all:
        - q: "sex"
          ne: "男性"
        - q: "age"
          lt: 50
  - id: "pregnancy_weeks"
    type: "number"
    text: "妊娠何週ですか？"
    karte: "妊娠週数"
    tag: "基本情報"
    hint: "わからない場合は、そのまま次へ進んでください。"
    unit: "週"
    show_if:
      all:
        - q: "sex"
          ne: "男性"
        - q: "age"
          lt: 50
        - q: "pregnancy"
          eq: "妊娠中"
