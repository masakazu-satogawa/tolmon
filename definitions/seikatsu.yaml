# トルモンの問診定義。白紙の問診票から Claude が下書きを作り、人が確認して確定したもの。
# もとの帳票: 生活習慣病管理料.pdf
# 書き方は CLAUDE.md「4. 問診定義」を参照。
id: "seikatsu"
title: "生活習慣病管理料 対象患者様 アンケート"
version: 1
questions:
  - id: "meal_balance"
    type: "single"
    text: "1日3食、バランスよく食べていますか？"
    karte: "3食バランス良い食事摂取"
    tag: "生活歴"
    options:
      - label: "はい"
      - label: "いいえ"
  - id: "vegetable_freq"
    type: "single"
    text: "野菜・きのこ・海藻などを、週に何回くらい食べますか？"
    karte: "野菜・きのこ・海藻摂取頻度"
    tag: "生活歴"
    options:
      - label: "週に5〜7回"
        karte: "週5〜7回"
      - label: "週に3〜5回"
        karte: "週3〜5回"
      - label: "週に0〜2回"
        karte: "週0〜2回"
  - id: "fried_food_freq"
    type: "single"
    text: "揚げ物を、週に何回くらい食べますか？"
    karte: "揚げ物摂取頻度"
    tag: "生活歴"
    options:
      - label: "週に0〜2回"
        karte: "週0〜2回"
      - label: "週に3〜5回"
        karte: "週3〜5回"
      - label: "週に5〜7回"
        karte: "週5〜7回"
  - id: "alcohol_freq"
    type: "single"
    text: "お酒を飲むのは、週に何回くらいですか？"
    karte: "飲酒頻度"
    tag: "生活歴"
    options:
      - label: "週に0〜3回"
        karte: "週0〜3回"
      - label: "週に4〜6回"
        karte: "週4〜6回"
      - label: "週に7回"
        karte: "週7回"
  - id: "snack_freq"
    type: "single"
    text: "1日に間食（おやつ）を何回しますか？"
    karte: "間食回数（1日）"
    tag: "生活歴"
    options:
      - label: "0回"
      - label: "1回"
      - label: "2回以上"
  - id: "meal_count"
    type: "single"
    text: "1日に食事を何回とりますか？"
    karte: "食事回数（1日）"
    tag: "生活歴"
    options:
      - label: "3回"
      - label: "1〜2回"
      - label: "4回以上"
  - id: "salty_food"
    type: "single"
    text: "味の濃いものを食べる量は、どちらに近いですか？"
    karte: "濃い味付けの摂取量"
    tag: "生活歴"
    options:
      - label: "少ない"
      - label: "多い"
  - id: "eating_out_freq"
    type: "single"
    text: "外食するのは、週に何回くらいですか？"
    karte: "外食頻度"
    tag: "生活歴"
    options:
      - label: "週に0回"
        karte: "週0回"
      - label: "週に1〜2回"
        karte: "週1〜2回"
      - label: "週に3回以上"
        karte: "週3回以上"
  - id: "bento_freq"
    type: "single"
    text: "お弁当やお惣菜を食べるのは、週に何回くらいですか？"
    karte: "弁当・総菜摂取頻度"
    tag: "生活歴"
    options:
      - label: "週に0〜1回"
        karte: "週0〜1回"
      - label: "週に2〜4回"
        karte: "週2〜4回"
      - label: "週に5回以上"
        karte: "週5回以上"
  - id: "bread_freq"
    type: "single"
    text: "パンを食べるのは、週に何回くらいですか？"
    karte: "パン摂取頻度"
    tag: "生活歴"
    options:
      - label: "週に0〜1回"
        karte: "週0〜1回"
      - label: "週に2〜4回"
        karte: "週2〜4回"
      - label: "週に5回以上"
        karte: "週5回以上"
  - id: "noodle_freq"
    type: "single"
    text: "麺類を食べるのは、週に何回くらいですか？"
    karte: "麺類摂取頻度"
    tag: "生活歴"
    options:
      - label: "週に0〜1回"
        karte: "週0〜1回"
      - label: "週に2〜4回"
        karte: "週2〜4回"
      - label: "週に5回以上"
        karte: "週5回以上"
  - id: "exercise_habit"
    type: "single"
    text: "1回30分以上、軽く汗をかく運動を、週2日以上・1年以上続けていますか？"
    karte: "運動習慣（30分以上・週2日以上・1年以上）"
    tag: "生活歴"
    options:
      - label: "はい"
        karte: "あり"
      - label: "いいえ"
        karte: "なし"
  - id: "daily_activity"
    type: "single"
    text: "ふだんの生活で、歩くことや同じくらい体を動かすことを、1日1時間以上していますか？"
    karte: "身体活動（歩行等1日1時間以上）"
    tag: "生活歴"
    options:
      - label: "はい"
        karte: "あり"
      - label: "いいえ"
        karte: "なし"
  - id: "daytime_sleepiness"
    type: "single"
    text: "昼間に眠くなることがよくありますか？"
    karte: "日中の眠気（頻回）"
    tag: "現病歴"
    options:
      - label: "いいえ"
        karte: "なし"
      - label: "はい"
        karte: "あり"
  - id: "daytime_headache"
    type: "single"
    text: "昼間に頭が痛くなることがよくありますか？"
    karte: "日中の頭痛（頻回）"
    tag: "現病歴"
    options:
      - label: "いいえ"
        karte: "なし"
      - label: "はい"
        karte: "あり"
  - id: "eye_exam"
    type: "single"
    text: "この1年以内に、眼科にかかりましたか？"
    karte: "1年以内の眼科受診"
    tag: "その他"
    options:
      - label: "はい"
        karte: "あり"
      - label: "いいえ"
        karte: "なし"
  - id: "dental_visit"
    type: "single"
    text: "この1年以内に、歯医者さんにかかりましたか？"
    karte: "1年以内の歯科受診"
    tag: "その他"
    options:
      - label: "はい"
        karte: "あり"
      - label: "いいえ"
        karte: "なし"
  - id: "smoking"
    type: "single"
    text: "今、たばこを習慣的に吸っていますか？"
    karte: "現在の習慣的喫煙"
    tag: "生活歴"
    hint: "目安：これまでに合計100本以上、または6か月以上吸っていて、この1か月も吸っている場合は「はい」です。"
    options:
      - label: "いいえ"
        karte: "なし"
      - label: "はい"
        karte: "あり"
  - id: "smoking_cessation_clinic"
    type: "single"
    text: "禁煙外来（たばこをやめるための外来）を希望しますか？"
    karte: "禁煙外来希望"
    tag: "生活歴"
    options:
      - label: "いいえ"
        karte: "希望なし"
      - label: "はい"
        karte: "希望あり"
    show_if:
      q: "smoking"
      eq: "はい"
