# トルモンの問診定義。白紙の問診票から Claude が下書きを作り、人が確認して確定したもの。
# もとの帳票: 総合診療科.pdf
# 書き方は CLAUDE.md「4. 問診定義」を参照。
id: "naika"
title: "内科 初診問診票"
version: 1
questions:
  - id: "age"
    type: "number"
    text: "年齢を教えてください。"
    karte: "年齢"
    tag: "基本情報"
    unit: "歳"
  - id: "sex"
    type: "single"
    text: "性別を教えてください。"
    karte: "性別"
    tag: "基本情報"
    options:
      - label: "男性"
      - label: "女性"
  - id: "myna_consent"
    type: "single"
    text: "マイナ保険証で、診療情報を病院が見ることに同意しましたか？"
    karte: "マイナ保険証 診療情報取得同意"
    tag: "その他"
    options:
      - label: "はい"
        karte: "同意あり"
      - label: "いいえ"
        karte: "同意なし"
  - id: "temp_now"
    type: "number"
    text: "いまの体温を教えてください。"
    karte: "現在の体温"
    tag: "現病歴"
    hint: "測っていないときは、とばしてください。"
    unit: "℃"
  - id: "temp_max"
    type: "number"
    text: "今回の症状が出てから、いちばん高かった体温を教えてください。"
    karte: "最高体温"
    tag: "現病歴"
    hint: "測っていないときは、とばしてください。"
    unit: "℃"
  - id: "temp_max_date"
    type: "single"
    text: "いちばん体温が高かったのは、いつですか？"
    karte: "最高体温の日時"
    tag: "現病歴"
    options:
      - label: "今日"
      - label: "昨日"
      - label: "おととい"
      - label: "3日以上前"
      - label: "わからない"
        karte: "不明"
  - id: "symptoms"
    type: "multi"
    text: "どのような症状ですか？ご相談の内容も、あてはまるものをすべて選んでください。"
    karte: "主訴"
    tag: "主訴"
    required: true
    options:
      - label: "熱がある"
        karte: "発熱"
      - label: "せき・たん"
        karte: "咳・痰"
      - label: "のどが痛い"
        karte: "咽頭痛"
      - label: "頭が痛い"
        karte: "頭痛"
      - label: "おなかが痛い"
        karte: "腹痛"
      - label: "胸が痛い・どうきがする"
        karte: "胸痛・動悸"
      - label: "息苦しい"
        karte: "呼吸困難感"
      - label: "睡眠時無呼吸の相談"
        karte: "睡眠時無呼吸"
      - label: "禁煙の相談"
        karte: "禁煙"
      - label: "健康診断の精密検査の相談"
        karte: "健診精査"
      - label: "飲み込みの相談"
        karte: "嚥下"
      - label: "骨粗しょう症の相談"
        karte: "骨粗鬆症"
      - label: "物忘れの相談"
        karte: "物忘れ"
      - label: "その他"
        detail: "ほかの症状があれば教えてください"
  - id: "last_meal"
    type: "time"
    text: "最後に食事をしたのは、何時何分ごろですか？"
    karte: "最終食事時刻"
    tag: "その他"
  - id: "onset"
    type: "single"
    text: "その症状は、いつごろからですか？"
    karte: "発症時期"
    tag: "現病歴"
    options:
      - label: "今日から"
      - label: "昨日から"
      - label: "2〜3日前から"
      - label: "1週間くらい前から"
      - label: "2〜3週間前から"
      - label: "1か月くらい前から"
      - label: "2〜3か月前から"
      - label: "半年くらい前から"
      - label: "1年以上前から"
      - label: "わからない"
        karte: "不明"
  - id: "onset_time"
    type: "single"
    text: "その症状は、何時ごろからですか？"
    karte: "発症時刻"
    tag: "現病歴"
    options:
      - label: "朝"
      - label: "昼"
      - label: "夕方"
      - label: "夜"
      - label: "夜中"
        karte: "夜間"
      - label: "わからない"
        karte: "不明"
    show_if:
      any:
        - q: "onset"
          eq: "今日から"
        - q: "onset"
          eq: "昨日から"
  - id: "allergy_food"
    type: "single"
    text: "食べ物のアレルギーはありますか？"
    karte: "食物アレルギー"
    tag: "アレルギー"
    options:
      - label: "ある"
        alert: true
        karte: "あり"
      - label: "ない"
        karte: "なし"
      - label: "わからない"
        karte: "不明"
  - id: "allergy_food_items"
    type: "multi"
    text: "アレルギーのある食べ物を、すべて選んでください。"
    karte: "食物アレルギー内容"
    tag: "アレルギー"
    alert: true
    options:
      - label: "卵"
      - label: "牛乳"
      - label: "その他"
        detail: "食べ物の名前を教えてください"
    show_if:
      q: "allergy_food"
      eq: "ある"
  - id: "allergy_drug"
    type: "single"
    text: "薬のアレルギーや、薬で具合が悪くなったことはありますか？"
    karte: "薬剤アレルギー・副作用歴"
    tag: "アレルギー"
    options:
      - label: "ある"
        alert: true
        karte: "あり"
        detail: "薬の名前を教えてください"
      - label: "ない"
        karte: "なし"
      - label: "わからない"
        karte: "不明"
  - id: "history"
    type: "single"
    text: "これまでに手術や治療を受けたこと、または今ほかの病院に通っていることはありますか？"
    karte: "既往歴・通院歴"
    tag: "既往歴"
    options:
      - label: "はい"
        karte: "あり"
        detail: "病気の名前と、いつ頃かを教えてください（例：高血圧 10年前から通院、胃の手術 2015年）"
      - label: "いいえ"
        karte: "なし"
  - id: "medication"
    type: "single"
    text: "いま飲んでいるお薬はありますか？"
    karte: "内服薬"
    tag: "内服薬"
    options:
      - label: "ある"
        karte: "あり"
        detail: "お薬の名前を教えてください"
      - label: "ない"
        karte: "なし"
      - label: "わからない"
        karte: "不明"
  - id: "smoking"
    type: "single"
    text: "たばこは吸いますか？"
    karte: "喫煙歴"
    tag: "生活歴"
    options:
      - label: "今、吸っている"
        karte: "現在喫煙"
      - label: "以前は吸っていた"
        karte: "過去喫煙"
      - label: "吸わない"
        karte: "非喫煙"
  - id: "smoking_per_day"
    type: "number"
    text: "1日に何本くらい吸いますか（吸っていましたか）？"
    karte: "喫煙本数"
    tag: "生活歴"
    unit: "本"
    show_if:
      q: "smoking"
      ne: "吸わない"
  - id: "smoking_years"
    type: "number"
    text: "たばこを吸っている（吸っていた）のは何年くらいですか？"
    karte: "喫煙年数"
    tag: "生活歴"
    unit: "年"
    show_if:
      q: "smoking"
      ne: "吸わない"
  - id: "alcohol"
    type: "single"
    text: "お酒はどのくらい飲みますか？"
    karte: "飲酒頻度"
    tag: "生活歴"
    options:
      - label: "毎日"
      - label: "週に何日か飲む"
        karte: "週に数日"
      - label: "飲まない"
  - id: "alcohol_days"
    type: "number"
    text: "1週間に何日お酒を飲みますか？"
    karte: "飲酒日数（週）"
    tag: "生活歴"
    unit: "日"
    show_if:
      q: "alcohol"
      eq: "週に何日か飲む"
  - id: "alcohol_amount"
    type: "multi"
    text: "1回に飲むお酒の種類を、すべて選んでください。"
    karte: "1回飲酒量"
    tag: "生活歴"
    options:
      - label: "ビール"
        detail: "1回の量（例：中びん1本、350mL缶2本）"
      - label: "日本酒"
        detail: "1回の量（例：1合）"
      - label: "焼酎"
        detail: "1回の量（例：コップ1杯）"
      - label: "ワイン"
        detail: "1回の量（例：グラス2杯）"
      - label: "ウイスキー"
        detail: "1回の量（例：ダブル1杯）"
      - label: "チューハイ・サワー"
        detail: "1回の量（例：350mL缶1本）"
      - label: "その他"
        detail: "お酒の種類と1回の量"
    show_if:
      q: "alcohol"
      ne: "飲まない"
  - id: "pregnancy"
    type: "single"
    text: "いま、妊娠中または授乳中ですか？"
    karte: "妊娠・授乳"
    tag: "その他"
    options:
      - label: "妊娠中"
        alert: true
      - label: "授乳中"
        alert: true
      - label: "妊娠していない"
        karte: "妊娠なし"
      - label: "わからない"
        karte: "不明"
    show_if:
      all:
        - q: "sex"
          ne: "男性"
        - q: "age"
          lt: 50
  - id: "pregnancy_weeks"
    type: "number"
    text: "妊娠何週ですか？"
    karte: "妊娠週数"
    tag: "その他"
    unit: "週"
    show_if:
      q: "pregnancy"
      eq: "妊娠中"
  - id: "doctor_request"
    type: "single"
    text: "診察してほしい医師のご希望はありますか？"
    karte: "診察医希望"
    tag: "その他"
    options:
      - label: "希望はない"
        karte: "希望なし"
      - label: "希望する医師がいる"
        karte: "希望あり"
        detail: "医師の名前を教えてください"
