# トルモンの問診定義。白紙の問診票から Claude が下書きを作り、人が確認して確定したもの。
# もとの帳票: 整形外科.pdf
# 書き方は CLAUDE.md「4. 問診定義」を参照。
id: "seikei"
title: "整形・外科 初診問診票"
version: 1
questions:
  - id: "age"
    type: "number"
    text: "年齢を教えてください。"
    karte: "年齢"
    tag: "基本情報"
    unit: "歳"
  - id: "sex"
    type: "single"
    text: "性別を教えてください。"
    karte: "性別"
    tag: "基本情報"
    options:
      - label: "男性"
      - label: "女性"
  - id: "myna_consent"
    type: "single"
    text: "マイナ保険証で、診療の情報を見ることに同意しましたか？"
    karte: "マイナ保険証診療情報取得同意"
    tag: "その他"
    options:
      - label: "はい"
        karte: "同意あり"
      - label: "いいえ"
        karte: "同意なし"
  - id: "temp_now"
    type: "number"
    text: "今の体温を教えてください。"
    karte: "現在の体温"
    tag: "現病歴"
    unit: "℃"
  - id: "temp_max"
    type: "number"
    text: "最近でいちばん高かった体温を教えてください。"
    karte: "最高体温"
    tag: "現病歴"
    unit: "℃"
  - id: "temp_max_when"
    type: "single"
    text: "いちばん体温が高かったのは、いつですか？"
    karte: "最高体温の日時"
    tag: "現病歴"
    options:
      - label: "今日"
      - label: "昨日"
      - label: "おととい"
        karte: "一昨日"
      - label: "3日以上前"
      - label: "わからない"
        karte: "不明"
  - id: "site"
    type: "body"
    text: "症状のある場所を、体の図で教えてください。"
    karte: "症状部位"
    tag: "主訴"
    required: true
  - id: "symptoms"
    type: "multi"
    text: "どのような症状ですか？あてはまるものをすべて選んでください。"
    karte: "症状"
    tag: "主訴"
    required: true
    options:
      - label: "痛い"
        karte: "疼痛"
      - label: "しびれる"
        karte: "しびれ"
      - label: "腫れ"
        karte: "腫脹"
      - label: "動きにくい"
        karte: "可動困難"
      - label: "熱がある"
        karte: "熱感・発熱"
      - label: "つっぱる"
        karte: "つっぱり感"
      - label: "こわばる"
        karte: "こわばり"
      - label: "何か出来ている"
        karte: "腫瘤・できもの"
      - label: "その他"
        detail: "どのような症状か教えてください"
  - id: "onset"
    type: "single"
    text: "今回の症状は、いつごろからですか？"
    karte: "発症時期"
    tag: "現病歴"
    options:
      - label: "今日から"
        karte: "本日から"
      - label: "昨日から"
      - label: "2〜3日前から"
      - label: "1週間くらい前から"
        karte: "約1週間前から"
      - label: "2〜3週間前から"
      - label: "1か月くらい前から"
        karte: "約1か月前から"
      - label: "2〜3か月前から"
      - label: "半年くらい前から"
        karte: "約半年前から"
      - label: "1年以上前から"
      - label: "わからない"
        karte: "不明"
  - id: "cause"
    type: "multi"
    text: "症状の原因に、思い当たることはありますか？あてはまるものをすべて選んでください。"
    karte: "思い当たる原因"
    tag: "現病歴"
    options:
      - label: "転んだ"
        karte: "転倒"
      - label: "ぶつけた"
        karte: "打撲"
      - label: "ひねった"
        karte: "捻り"
      - label: "重い物を持った"
        karte: "重量物挙上"
      - label: "スポーツ中"
      - label: "仕事中"
      - label: "交通事故"
      - label: "同じ動作のくり返し"
        karte: "反復動作"
      - label: "思い当たらない"
        karte: "思い当たる原因なし"
      - label: "その他"
        detail: "思い当たる原因をできるだけ詳しく教えてください"
  - id: "past_illness"
    type: "multi"
    text: "これまでに、次の病気にかかったことはありますか？あてはまるものをすべて選んでください。"
    karte: "既往歴"
    tag: "既往歴"
    options:
      - label: "かかったことはない"
        karte: "なし"
      - label: "喘息"
      - label: "じんましんなどのアレルギーの病気"
        karte: "じんましん等のアレルギー疾患"
      - label: "心臓病"
      - label: "高血圧"
      - label: "腎臓病"
      - label: "肝臓病"
      - label: "糖尿病"
      - label: "胃潰瘍"
      - label: "十二指腸潰瘍"
      - label: "その他"
        detail: "病気の名前を教えてください"
  - id: "current_treatment"
    type: "single"
    text: "今、治療中の病気はありますか？"
    karte: "治療中の疾患"
    tag: "既往歴"
    options:
      - label: "ある"
        karte: "あり"
        detail: "病気の名前を教えてください"
      - label: "ない"
        karte: "なし"
  - id: "drug_reaction"
    type: "single"
    text: "薬を飲んで、具合が悪くなったことはありますか？"
    karte: "薬剤副作用歴"
    tag: "アレルギー"
    options:
      - label: "ある"
        alert: true
        karte: "あり"
        detail: "薬の名前や、どうなったかを教えてください"
      - label: "ない"
        karte: "なし"
      - label: "薬をあまり飲んだことがないので分からない"
        karte: "服薬経験少なく不明"
  - id: "pregnancy"
    type: "single"
    text: "今、妊娠中、または授乳中ですか？"
    karte: "妊娠・授乳"
    tag: "その他"
    options:
      - label: "妊娠中"
        alert: true
      - label: "授乳中"
        alert: true
      - label: "妊娠していない"
        karte: "妊娠なし"
      - label: "分からない"
        karte: "不明"
    show_if:
      all:
        - q: "sex"
          ne: "男性"
        - q: "age"
          lt: 50
  - id: "grade"
    type: "single"
    text: "学生の方は、学年を教えてください。"
    karte: "学年"
    tag: "生活歴"
    options:
      - label: "学生ではない"
      - label: "小学1年"
      - label: "小学2年"
      - label: "小学3年"
      - label: "小学4年"
      - label: "小学5年"
      - label: "小学6年"
      - label: "中学1年"
      - label: "中学2年"
      - label: "中学3年"
      - label: "高校1年"
      - label: "高校2年"
      - label: "高校3年"
      - label: "大学・専門学校"
    show_if:
      q: "age"
      lt: 25
  - id: "club"
    type: "single"
    text: "部活は何をしていますか？"
    karte: "部活"
    tag: "生活歴"
    options:
      - label: "野球"
      - label: "サッカー"
      - label: "バスケットボール"
      - label: "バレーボール"
      - label: "テニス"
      - label: "卓球"
      - label: "陸上"
      - label: "水泳"
      - label: "柔道・剣道"
      - label: "文化部"
      - label: "していない"
        karte: "部活なし"
      - label: "その他"
        detail: "部活の名前を教えてください"
    show_if:
      all:
        - q: "age"
          lt: 25
        - q: "grade"
          ne: "学生ではない"
