<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シェーマの区切り確認 | トルモン</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { font-size: 16px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 120px; }
  h1 { font-size: 1.3rem; }
  .bar { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin: 10px 0 16px; }
  .bar label { display: flex; gap: 6px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .card h2 { font-size: 1rem; margin: 0 0 6px; color: var(--accent); }
  .card .body-svg { max-height: 520px; }
  .now { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: #fff; padding: 12px 20px; font-weight: 700; }
  .now small { font-weight: 400; opacity: .8; margin-left: 12px; }
</style>
</head>
<body>
<main>
  <h1>人体シェーマ：タップの区切り確認（職員用）</h1>
  <p class="sub">図をタップすると、その場所が何という部位として記録されるかが下に出ます。オレンジの点線が区切りです。</p>
  <div class="bar">
    <label><input type="checkbox" id="bounds" checked> 区切りを表示</label>
    <label><input type="radio" name="sex" value="m" checked> 男性の図</label>
    <label><input type="radio" name="sex" value="f"> 女性の図</label>
    <button id="clear" class="d-btn" type="button">選択をすべて消す</button>
  </div>
  <div id="grid" class="grid"></div>
</main>
<div class="now"><span id="now">図をタップしてください</span><small id="picked"></small></div>

<script src="/static/body-data.js"></script>
<script src="/static/body.js"></script>
<script>
"use strict";
var labels = {}, selected = {}, sex = "m";
function render() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  TolmonBody.views.forEach(function (v) {
    var card = document.createElement("div");
    card.className = "card";
    var h = document.createElement("h2");
    h.textContent = v.label;
    var box = document.createElement("div");
    card.appendChild(h);
    card.appendChild(box);
    grid.appendChild(card);
    TolmonBody.draw(v.id, box, selected, function (id) {
      if (selected[id]) delete selected[id]; else selected[id] = true;
      document.getElementById("now").textContent = (labels[id] || id) + "（" + id + "）";
      render();
    }, sex);
    if (document.getElementById("bounds").checked) box.firstChild.setAttribute("class", "body-svg bounds");
  });
  document.getElementById("picked").textContent = Object.keys(selected).map(function (id) { return labels[id] || id; }).join("、");
}
document.getElementById("bounds").addEventListener("change", render);
document.getElementById("clear").addEventListener("click", function () { selected = {}; render(); });
var radios = document.querySelectorAll("input[name=sex]");
for (var i = 0; i < radios.length; i++) radios[i].addEventListener("change", function () { sex = this.value; render(); });
fetch("/api/body").then(function (r) { return r.json(); }).then(function (b) { labels = b.regions; render(); });
</script>
</body>
</html>
