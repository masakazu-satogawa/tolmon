<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>問診 | トルモン</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main id="app">

  <!-- 受付（職員が操作） -->
  <section id="s-reception" class="screen">
    <header class="staff-head">
      <span class="badge">受付用</span>
      <h1>問診をはじめる</h1>
    </header>
    <div class="step">
      <h2><span class="num">1</span>問診票を選ぶ</h2>
      <div id="form-list" class="form-list"></div>
      <p id="form-errors" class="warn" hidden></p>
    </div>
    <div class="step">
      <h2><span class="num">2</span>患者IDを入力</h2>
      <input id="pcode" class="pcode-input" inputmode="numeric" autocomplete="off" placeholder="患者ID" aria-label="患者ID">
      <p id="pcode-msg" class="warn" hidden></p>
    </div>
    <button id="btn-start" class="btn primary wide" disabled>確認へ進む</button>
  </section>

  <!-- 患者向けのはじめの画面 -->
  <section id="s-welcome" class="screen" hidden>
    <div class="center">
      <p class="lead">これから、いくつか質問をします。</p>
      <p class="lead">わかる範囲でお答えください。</p>
      <p class="sub" id="welcome-count"></p>
      <button id="btn-begin" class="btn primary huge">はじめる</button>
    </div>
  </section>

  <!-- 1問ずつ -->
  <section id="s-question" class="screen" hidden>
    <div class="progress"><div id="progress-bar"></div></div>
    <p id="progress-text" class="progress-text"></p>
    <h1 id="q-text" class="q-text"></h1>
    <p id="q-hint" class="hint" hidden></p>
    <div id="q-body" class="q-body"></div>
    <p id="q-msg" class="warn" hidden></p>
    <footer class="nav">
      <button id="btn-back" class="btn">もどる</button>
      <button id="btn-next" class="btn primary">次へ</button>
    </footer>
  </section>

  <!-- 回答の確認 -->
  <section id="s-review" class="screen" hidden>
    <h1 class="q-text">お答えの内容を確認してください</h1>
    <ol id="review-list" class="review-list"></ol>
    <p id="submit-msg" class="warn" hidden></p>
    <footer class="nav">
      <button id="btn-review-back" class="btn">もどる</button>
      <button id="btn-submit" class="btn primary">この内容で送る</button>
    </footer>
  </section>

  <!-- 送信後 -->
  <section id="s-thanks" class="screen" hidden>
    <div class="center">
      <p class="big-check" aria-hidden="true">✓</p>
      <p class="lead">ありがとうございました。</p>
      <p class="lead">この端末を受付にお返しください。</p>
      <p class="sub">お呼びするまで、お待ちください。お大事になさってください。</p>
    </div>
  </section>

  <button id="btn-abort" class="abort" hidden>受付へ戻る</button>
</main>

<!-- 受付：患者IDの確認 -->
<div id="dlg-confirm" class="overlay" hidden>
  <div class="dialog">
    <p class="dlg-title">この内容で問診をはじめます</p>
    <p class="dlg-label">患者ID</p>
    <p id="confirm-pcode" class="confirm-pcode"></p>
    <p class="dlg-label">問診票</p>
    <p id="confirm-form" class="confirm-form"></p>
    <div class="dlg-actions">
      <button id="btn-confirm-no" class="btn">入力しなおす</button>
      <button id="btn-confirm-yes" class="btn primary">まちがいない・開始</button>
    </div>
  </div>
</div>

<!-- 無操作 -->
<div id="dlg-idle" class="overlay" hidden>
  <div class="dialog">
    <p class="dlg-title">問診を続けますか？</p>
    <p class="sub">あと <b id="idle-count"></b> 秒で、最初の画面にもどります。</p>
    <div class="dlg-actions">
      <button id="btn-idle-continue" class="btn primary wide">続ける</button>
    </div>
  </div>
</div>

<!-- 中止の確認（職員用） -->
<div id="dlg-abort" class="overlay" hidden>
  <div class="dialog">
    <p class="dlg-title">問診を中止して受付画面に戻りますか？</p>
    <p class="sub">入力中の回答は消えます。</p>
    <div class="dlg-actions">
      <button id="btn-abort-no" class="btn">続ける</button>
      <button id="btn-abort-yes" class="btn danger">中止する</button>
    </div>
  </div>
</div>

<script src="/static/patient.js"></script>
</body>
</html>
