# 架空のサンプル問診票（デモ用）。実在の病院の帳票ではありません。
# 書き方は CLAUDE.md「4. 問診定義」を参照。
id: "sample_naika"
title: "内科 初診問診票（サンプル）"
version: 1
questions:
  - id: "sex"
    type: "single"
    text: "性別を教えてください"
    karte: "性別"
    tag: "基本情報"
    options:
      - label: "男性"
        karte: "男性"
      - label: "女性"
        karte: "女性"
  - id: "age"
    type: "number"
    text: "年齢を教えてください"
    karte: "年齢"
    tag: "基本情報"
    unit: "歳"
    min: 0
    max: 120
  - id: "temp"
    type: "number"
    text: "今の体温を教えてください"
    karte: "体温"
    tag: "現病歴"
    unit: "℃"
    min: 34
    max: 43
    step: 0.1
  - id: "symptom"
    type: "multi"
    text: "どのような症状がありますか？（いくつでも）"
    karte: "症状"
    tag: "主訴"
    required: true
    options:
      - label: "熱がある"
        karte: "発熱"
      - label: "せき・たん"
        karte: "咳嗽・喀痰"
      - label: "のどが痛い"
        karte: "咽頭痛"
      - label: "おなかが痛い"
        karte: "腹痛"
      - label: "頭が痛い"
        karte: "頭痛"
      - label: "その他"
        karte: "その他"
        detail: "どのような症状か書いてください"
  - id: "onset"
    type: "text"
    text: "その症状はいつからですか？"
    karte: "発症時期"
    tag: "現病歴"
    hint: "例：きのうの夜から、3日前から"
  - id: "history"
    type: "single"
    text: "今、ほかの病院に通っていますか？"
    karte: "他院通院"
    tag: "既往歴"
    options:
      - label: "通っている"
        karte: "あり"
        detail: "病気の名前を書いてください"
      - label: "通っていない"
        karte: "なし"
  - id: "meds"
    type: "single"
    text: "飲んでいるお薬はありますか？"
    karte: "内服薬"
    tag: "内服薬"
    options:
      - label: "ある"
        karte: "あり"
        detail: "お薬の名前を書いてください（お薬手帳があれば受付へ）"
      - label: "ない"
        karte: "なし"
  - id: "allergy_food"
    type: "single"
    text: "食べ物のアレルギーはありますか？"
    karte: "食物アレルギー"
    tag: "アレルギー"
    options:
      - label: "ある"
        karte: "あり"
        detail: "食べ物の名前を書いてください"
      - label: "ない"
        karte: "なし"
  - id: "allergy_drug"
    type: "single"
    text: "お薬で具合が悪くなったことはありますか？"
    karte: "薬剤アレルギー・副作用歴"
    tag: "アレルギー"
    options:
      - label: "ある"
        karte: "あり"
        detail: "お薬の名前を書いてください"
      - label: "ない"
        karte: "なし"
      - label: "わからない"
        karte: "不明"
  - id: "smoke"
    type: "single"
    text: "たばこを吸いますか？"
    karte: "喫煙"
    tag: "生活歴"
    options:
      - label: "吸っている"
        karte: "現喫煙"
      - label: "以前吸っていた"
        karte: "既往喫煙"
      - label: "吸わない"
        karte: "非喫煙"
  - id: "smoke_num"
    type: "number"
    text: "1日に何本くらい吸いますか？"
    karte: "喫煙本数"
    tag: "生活歴"
    unit: "本/日"
    min: 0
    max: 200
    show_if:
      q: "smoke"
      eq: "吸っている"
  - id: "last_meal"
    type: "time"
    text: "最後にお食事をしたのは何時ごろですか？"
    karte: "最終食事"
    tag: "その他"
  - id: "pregnant"
    type: "single"
    text: "現在、妊娠中または授乳中ですか？"
    karte: "妊娠・授乳"
    tag: "その他"
    # 男性・50歳以上には出さない（答えていなければ出す）
    show_if:
      all:
        - q: "sex"
          ne: "男性"
        - q: "age"
          lt: 50
    options:
      - label: "妊娠中"
        karte: "妊娠中"
      - label: "授乳中"
        karte: "授乳中"
      - label: "どちらでもない"
        karte: "該当なし"
      - label: "わからない"
        karte: "不明"
